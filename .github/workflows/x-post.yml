# v2 — Posts approved, due rows of derivatives/x/queue.tsv to @ThemeMISELL (X API has no scheduling).
# Public repo: Actions minutes are free, so we run exactly at the three launchd-equivalent times.
# JST 12:11, 12:41, 22:11  ==  UTC 03:11, 03:41, 13:11. GitHub cron can start late; the script
# posts rows up to 6h late and marks older ones "missed".
name: x-post
on:
  schedule:
    - cron: "11 3 * * *"
    - cron: "41 3 * * *"
    - cron: "11 13 * * *"
  workflow_dispatch:
    inputs:
      live:
        description: "Actually post (false = dry run)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: x-post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow==11.0.0
      - name: Post due rows
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          # scheduled runs post only when the repo variable X_POST_LIVE is "true" (kill switch);
          # manual runs follow the "live" input
          LIVE: ${{ github.event_name == 'schedule' && vars.X_POST_LIVE == 'true' || github.event_name == 'workflow_dispatch' && inputs.live }}
        run: |
          if [ "$LIVE" = "true" ]; then python3 growth/scripts/x_post_due.py --live; else python3 growth/scripts/x_post_due.py; fi
      - name: Commit queue / label updates
        run: |
          git config user.name "sugoi-x-bot"
          git config user.email "actions@users.noreply.github.com"
          git add derivatives/x/queue.tsv growth/x-posts.tsv 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "chore(x): record posted rows [skip ci]"; git pull --rebase --quiet; git push; }
